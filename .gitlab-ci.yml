image: python:3.11

stages:
  - security

security-scan:
  stage: security
  script:
    - pip install --upgrade pip || true
    - pip install -r requirements.txt || true
    - bandit -r app.py -f json -o bandit-report.json || true
    - safety check --json > safety-report.json || true
    - exit 0
  artifacts:
    when: always
    paths:
      - bandit-report.json
      - safety-report.json
    expire_in: 1 week
