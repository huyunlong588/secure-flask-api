image: python:3.11

stages:
  - security

security-scan:
  stage: security
  script:
    - echo "=== [1/4] Installing dependencies ==="
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - echo "=== [2/4] SAST: Bandit static analysis ==="
    - bandit -r app.py -f json -o bandit-report.json
    - echo "=== [3/4] SCA: Safety dependency scan ==="
    - safety check --json > safety-report.json || echo "Safety: offline/no network, skipping SCA report"
    - echo "=== [4/4] Scan finished ==="
    - exit 0
  artifacts:
    when: always
    paths:
      - bandit-report.json
      - safety-report.json
    expire_in: 1 week
