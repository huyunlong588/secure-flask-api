image: python:3.11

stages:
  - security

security-scan:
  stage: security
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    # SAST: Bandit static application security testing
    - bandit -r app.py -f json -o bandit-report.json || true
    # SCA: Safety dependency vulnerability check
    - safety check --json > safety-report.json || true
  artifacts:
    when: always
    paths:
      - bandit-report.json
      - safety-report.json
    expire_in: 1 week
