name: Secure CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "bandit==1.9.4" "pbr==7.1.3" "safety==2.3.5" "dparse==0.6.4"

      - name: Smoke test - import the application
        run: python -c "import app; print('app imported successfully')"

      - name: SAST - Bandit static code scan
        run: |
          bandit -r app.py -ll -f txt -o bandit-report.txt
          cat bandit-report.txt

      - name: SCA - Safety dependency vulnerability scan
        run: |
          set +e
          safety check -r requirements.txt --full-report > safety-report.txt 2>&1
          status=$?
          cat safety-report.txt
          exit $status

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: |
            bandit-report.txt
            safety-report.txt
          if-no-files-found: warn
          retention-days: 30